name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Check, test, and smoke test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0.15
        ports: ["27018:27017"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install EC2 SDK dependencies
        run: npm ci --ignore-scripts
        working-directory: ui/apps/agentic-apps/ec2
      - name: Install FinOps SDK dependencies
        run: npm ci --ignore-scripts
        working-directory: ui/apps/agentic-apps/finops
      - name: Install SecOps SDK dependencies
        run: npm ci --ignore-scripts
        working-directory: ui/apps/agentic-apps/secops
      - name: Audit SecOps SDK dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui/apps/agentic-apps/secops
      - name: Audit FinOps SDK dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui/apps/agentic-apps/finops
      - name: Audit EC2 SDK dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui/apps/agentic-apps/ec2
      - name: Install Presentation Generator dependencies
        run: npm ci --prefix ui/apps/agentic-apps/presentations --ignore-scripts
      - name: Audit Presentation Generator dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui/apps/agentic-apps/presentations
      - name: Check out pinned canonical host SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: caipe-io/ai-platform-engineering
          ref: 765583051b47b7daa7e6f0e2048fa6ac42345a8a
          path: .contract-host
          sparse-checkout: ui/app-sdk
          persist-credentials: false
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit and presentation Mongo/HTTP/MCP tests
        run: npm test
        env:
          PRESENTATION_TEST_MONGO: "1"
          CAIPE_APP_SDK_ROOT: ${{ github.workspace }}/.contract-host/ui/app-sdk
      - name: Run application smoke tests
        run: npm run smoke
      - name: Check canonical presentation manifest
        run: node .contract-host/ui/app-sdk/bin/check-manifest.mjs ui/apps/agentic-apps/presentations/deploy/app.json
      - name: Generate presentation schema fixtures
        run: node ui/apps/agentic-apps/presentations/test/generate-schema-fixtures.mjs "$RUNNER_TEMP/presentation-openxml-fixtures"
      - name: Validate PowerPoints with Microsoft Open XML SDK
        run: |
          docker run --rm -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 \
            -v "$GITHUB_WORKSPACE/ui/apps/agentic-apps/presentations/test/openxml:/validator:ro" \
            -v "$RUNNER_TEMP/presentation-openxml-fixtures:/fixtures:ro" \
            mcr.microsoft.com/dotnet/sdk:10.0-noble@sha256:bef136a371963aaa46ec97882845ef6f54dec15728bb4b128b1c2a400ffbc9b4 \
            sh -c 'cp -R /validator /tmp/validator && cd /tmp/validator && dotnet run --project Validator.csproj -- /fixtures/*.pptx'

  image-matrix:
    name: Resolve application image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Validate image manifest
        id: matrix
        run: echo "matrix=$(node scripts/check-app-image-manifest.mjs --matrix)" >> "$GITHUB_OUTPUT"

  container:
    name: Build ${{ matrix.id }} image
    runs-on: ubuntu-latest
    needs: [test, image-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-matrix.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP_ID=${{ matrix.id }}
            APP_PORT=${{ matrix.port }}
            APP_BUILD_VERSION=ci
            APP_BUILD_REVISION=${{ github.sha }}
          tags: caipe/${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=min,scope=${{ matrix.id }}
          provenance: false
          sbom: false

  sdlc-build:
    name: Build Ship Loop and PR dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Install app dependencies
        run: npm ci --ignore-scripts
        working-directory: ui/apps/agentic-apps/agentic-sdlc/ship-loop
      - name: Compile production runtime and type check
        run: npm run build
        working-directory: ui/apps/agentic-apps/agentic-sdlc/ship-loop
      - name: Audit app dependencies
        run: npm audit --audit-level=high
        working-directory: ui/apps/agentic-apps/agentic-sdlc/ship-loop
