name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Check, test, and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install EC2 SDK dependencies
        run: npm ci --ignore-scripts
        working-directory: ui/apps/agentic-apps/ec2
      - name: Install FinOps SDK dependencies
        run: npm ci --ignore-scripts
        working-directory: ui/apps/agentic-apps/finops
      - name: Install SecOps SDK dependencies
        run: npm ci --ignore-scripts
        working-directory: ui/apps/agentic-apps/secops
      - name: Audit SecOps SDK dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui/apps/agentic-apps/secops
      - name: Audit FinOps SDK dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui/apps/agentic-apps/finops
      - name: Audit EC2 SDK dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui/apps/agentic-apps/ec2
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Run application smoke tests
        run: npm run smoke

  native-package:
    name: Validate Agentic SDLC native package
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Checkout pinned CAIPE native contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: caipe-io/ai-platform-engineering
          ref: 6dff8796bca9057ba566b23cfff415689869dbd6
          path: caipe-host
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Check the native extension contract
        run: node caipe-host/ui/scripts/check-native-extension.mjs ui/apps/agentic-apps/agentic-sdlc/native-package
      - name: Verify publishable package contents
        run: npm pack ./ui/apps/agentic-apps/agentic-sdlc/native-package --dry-run

  image-matrix:
    name: Resolve application image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Validate image manifest
        id: matrix
        run: echo "matrix=$(node scripts/check-app-image-manifest.mjs --matrix)" >> "$GITHUB_OUTPUT"

  container:
    name: Build ${{ matrix.id }} image
    runs-on: ubuntu-latest
    needs: [test, image-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-matrix.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP_ID=${{ matrix.id }}
            APP_PORT=${{ matrix.port }}
            APP_BUILD_VERSION=ci
            APP_BUILD_REVISION=${{ github.sha }}
          tags: caipe/${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=min,scope=${{ matrix.id }}
          provenance: false
          sbom: false

  sdlc-build:
    name: Build Ship Loop and PR dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Install app dependencies
        run: npm ci --ignore-scripts
        working-directory: ui/apps/agentic-apps/agentic-sdlc/ship-loop
      - name: Compile production runtime and type check
        run: npm run build
        working-directory: ui/apps/agentic-apps/agentic-sdlc/ship-loop
      - name: Audit app dependencies
        run: npm audit --audit-level=high
        working-directory: ui/apps/agentic-apps/agentic-sdlc/ship-loop
