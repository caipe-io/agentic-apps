name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Check, test, and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Run application smoke tests
        run: npm run smoke

  weather-native-package:
    name: Validate Weather native package
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Checkout pinned CAIPE native contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: caipe-io/ai-platform-engineering
          ref: d876829c20f39c5ee76da9b4e5fa0fe2b2530054
          path: caipe-host
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Check the shared app manifest
        run: node caipe-host/ui/native-extension-sdk/bin/check-manifest.mjs ui/apps/agentic-apps/weather/native-package/manifest.json
      - name: Check the published native artifact
        run: |
          set -eu
          artifact_directory=$(mktemp -d)
          npm pack ./ui/apps/agentic-apps/weather/native-package --pack-destination "$artifact_directory"
          mkdir "$artifact_directory/unpacked"
          tar -xzf "$artifact_directory/caipe-weather-native-0.2.0.tgz" -C "$artifact_directory/unpacked" --strip-components=1
          node caipe-host/ui/scripts/check-native-extension.mjs "$artifact_directory/unpacked"

  image-matrix:
    name: Resolve application image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Validate image manifest
        id: matrix
        run: echo "matrix=$(node scripts/check-app-image-manifest.mjs --matrix)" >> "$GITHUB_OUTPUT"

  container:
    name: Build ${{ matrix.id }} image
    runs-on: ubuntu-latest
    needs: [test, image-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-matrix.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: build/Dockerfile.agentic-app
          build-args: |
            APP_ID=${{ matrix.id }}
            APP_PORT=${{ matrix.port }}
          tags: caipe/${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=min,scope=${{ matrix.id }}
          provenance: false
          sbom: false
